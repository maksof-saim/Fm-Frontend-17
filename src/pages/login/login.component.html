<form class="space-y-5" (ngSubmit)="onLogin()">

    <!-- Email -->
    <div>
        <label class="text-gray-700 font-medium">Email Address</label>
        <input type="email" [(ngModel)]="email" name="email"
            class="w-full mt-1 px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-green-400 outline-none"
            placeholder="example@email.com">

        <!-- Professional Email Errors -->
        <div *ngIf="errors.email" class="text-red-500 text-sm mt-1">
            {{ errors.email }}
        </div>
    </div>

    <!-- Password -->
    <div>
        <label class="text-gray-700 font-medium">Password</label>
        <input type="password" [(ngModel)]="password" name="password"
            class="w-full mt-1 px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-green-400 outline-none"
            placeholder="••••••••">

        <!-- Professional Password Errors -->
        <div *ngIf="errors.password" class="text-red-500 text-sm mt-1">
            {{ errors.password }}
        </div>
    </div>

    <!-- Server Error (Wrong password, wrong email, etc.) -->
    <div *ngIf="errors.server" class="text-red-600 font-semibold text-center mt-2">
        {{ errors.server }}
    </div>

    <button type="submit"
        class="block w-full py-2 rounded-lg bg-gradient-to-r from-green-500 to-yellow-500 text-white font-semibold text-lg mt-4 transition hover:shadow-xl hover:-translate-y-0.5 duration-300">
        Login
    </button>

    <p class="text-center mt-3 text-gray-600">
        Don’t have an account?
        <a routerLink="/signup" class="text-yellow-600 font-semibold">Sign up</a>
    </p>
</form>
