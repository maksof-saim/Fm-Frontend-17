<section class="mb-6">
    <app-swiper></app-swiper>
</section>

<!-- QUICK CATEGORIES -->
<section class="mb-8 bg-gradient-to-r from-emerald-50 via-white to-amber-100 p-2 sm:p-4">
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2 sm:gap-4">
        <a *ngFor="let cat of quickCategories"
            class="bg-white p-3 sm:p-4 rounded-lg shadow-md flex flex-col items-center justify-center transition hover:bg-gray-100 hover:shadow-xl cursor-pointer border border-gray-100 text-center">
            <span class="text-2xl sm:text-3xl md:text-4xl mb-1">{{ cat.icon }}</span>
            <p class="text-xs sm:text-sm md:text-base font-semibold text-gray-700">{{ cat.name }}</p>
        </a>
    </div>
</section>

<!-- SALE SECTION -->
<section class="mb-10 px-2 sm:px-4">
    <div class="bg-gradient-to-r from-emerald-300 via-white to-amber-100 p-4 sm:p-6 rounded-xl shadow-2xl text-center">
        <h2 class="text-xl sm:text-2xl md:text-3xl font-bold mb-2">
            ⚡ Sale is Live Now <span class="text-amber-500 font-bold">!</span>
        </h2>
        <p class="text-base sm:text-lg mb-4">Ends in:</p>

        <div class="flex justify-center space-x-2 sm:space-x-4 mb-4 sm:mb-6">
            <div class="text-gray-800 p-2 sm:p-4 bg-amber-500 rounded-lg w-14 sm:w-20 shadow-md">
                <div class="text-xl sm:text-3xl font-extrabold">07</div>
                <div class="text-xs sm:text-sm">DAYS</div>
            </div>
            <div class="text-gray-800 p-2 sm:p-4 bg-amber-500 rounded-lg w-14 sm:w-20 shadow-md">
                <div class="text-xl sm:text-3xl font-extrabold">03</div>
                <div class="text-xs sm:text-sm">HRS</div>
            </div>
            <div class="text-gray-800 p-2 sm:p-4 bg-amber-500 rounded-lg w-14 sm:w-20 shadow-md">
                <div class="text-xl sm:text-3xl font-extrabold">16</div>
                <div class="text-xs sm:text-sm">MIN</div>
            </div>
        </div>

        <button
            class="bg-black hover:bg-gray-700 text-amber-500 font-bold py-2 sm:py-3 px-5 sm:px-10 rounded-full transition">
            Shop Flash Deals
        </button>
    </div>
</section>

<!-- POPULAR PRODUCTS -->
<section class="mb-10 px-2 sm:px-4">
    <h2
        class="text-xl sm:text-2xl md:text-3xl font-bold text-gray-800 mb-4 sm:mb-6 border-b-2 border-green-600 pb-1 sm:pb-2">
        ⭐ Most Popular Products
    </h2>

    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2 sm:gap-4">
        <div *ngFor="let product of popularProducts"
            class="bg-white rounded-xl shadow-lg hover:shadow-xl transition overflow-hidden border border-gray-100">
            <div class="h-32 sm:h-40 md:h-48 bg-gray-100 flex items-center justify-center overflow-hidden">
                <div class="text-gray-500 text-xs sm:text-sm md:text-base truncate">[Image: {{ product.name }}]</div>
            </div>

            <div class="p-2 sm:p-3 md:p-4 text-center">
                <p class="text-[10px] sm:text-xs md:text-sm text-gray-500 uppercase">{{ product.category }}</p>
                <h3 class="text-sm sm:text-base md:text-lg font-semibold text-gray-900 mt-1 mb-2 sm:mb-3 truncate">
                    {{ product.name }}
                </h3>

                <div class="flex items-center justify-center space-x-1 sm:space-x-2 mb-2 sm:mb-3">
                    <span class="text-lg sm:text-xl md:text-2xl font-bold text-green-600">
                        ${{ product.price | number: '1.2-2' }}
                    </span>
                    <span *ngIf="product.isOnSale"
                        class="bg-amber-500 text-white text-[8px] sm:text-xs md:text-xs font-bold px-1 py-0.5 rounded">
                        SALE
                    </span>
                </div>

                <button
                    class="w-full bg-amber-500 hover:bg-amber-600 text-white font-medium py-1.5 sm:py-2 rounded-lg transition">
                    Add to Cart
                </button>
            </div>
        </div>
    </div>
</section>
