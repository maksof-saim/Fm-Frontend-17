<div class="p-4">
    <h1 class="text-2xl font-bold mb-4">Fish Market</h1>

    <!-- <div *ngIf="loading" class="mb-4">Loading...</div> -->
    <div *ngIf="error" class="text-red-500 mb-4">{{ error }}</div>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
        <div *ngFor="let fish of fishes" class="p-4 border rounded shadow-sm">
            <img *ngIf="fish.image" [src]="fish.image" alt="{{fish.name}}"
                class="w-full h-40 object-cover rounded mb-2" />
            <h2 class="font-semibold text-lg">{{ fish.name }}</h2>
            <!-- <p class="text-sm text-gray-600">{{ fish.species }}</p> -->
            <p class="mt-2 font-bold">Rs {{ fish.price }}</p>
            <!-- actions -->
            <div class="flex gap-2">
                <button (click)="openDetails(fish)" class="px-3 py-1 rounded border">Details</button>
                <button (click)="deleteFish(fish.id)" class="px-3 py-1 rounded border">Delete</button>
            </div>
        </div>
    </div>
    <div class="mt-6">
        <button (click)="addDummyFish()" class="px-4 py-2 rounded bg-blue-600 text-white">Add Dummy Fish</button>
    </div>
</div>
